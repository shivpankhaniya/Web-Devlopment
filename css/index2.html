<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Selectors Practice</title>
    <link rel="stylesheet" href="style4.css" />
  </head>
  <body>
    <h1>Selector in css</h1>

    <p id="paragraph">This is a simple paragraph.</p>

    <div>
      <h2 class="a">Box Title</h2>
      <p class="a">This is inside a box.</p>
    </div>

    <div>
      <h3 class="a">Special Box</h3>
      <p class="a">This box has both class and ID.</p>
    </div>

    <p class="a">Another paragraph with a class.</p>

    <button>Click Me</button>

    <div>
      <p>This is inside div</p>
    </div>

    
  </body>
</html>
