<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Selectors Practice</title>
    <link rel="stylesheet" href="style4.css" />
  </head>
  <body>
    <h1>Selector in css</h1>

    <p id="paragraph">This is a simple paragraph.</p>

    <div>
      <h2 class="a">Box Title</h2>
      <p class="a">This is inside a box.</p>
    </div>

    <div>
      <h3 class="a">Special Box</h3>
      <p class="a">This box has both class and ID.</p>
    </div>

    <p class="a">Another paragraph with a class.</p>

    <button id="btn">Click Me</button>

    <div>
      <p>This is inside div</p>
    </div>

    <h4>all rights</h4>
    <button>submit</button>

    <div>
      <h5>How are you!</h5>
      <button>submit</button>
    </div>
    <hr><br>

<div>
  <label for="uname"><b>username</b></label>
  <input
    type="text"
    placeholder="enter your username"
    id="uname"
    name="user"
  />

  <label for="pass"><b>password</b></label>
  <input
    type="password"
    placeholder="enter your password"
    id="pass"
    name="user"
  />
</div>
     
    </div>
  </body>
</html>
