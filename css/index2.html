<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Practice</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

    <h1>Selector in css</h1>

    <p>This is a simple paragraph.</p>

    <div class="box">
        <h2>Box Title</h2>
        <p>This is inside a box.</p>
    </div>

    <div class="box" id="special">
        <h3>Special Box</h3>
        <p>This box has both class and ID.</p>
    </div>

    <p class="text">Another paragraph with a class.</p>

    <button id="btn">Click Me</button>

</body>
</html>
