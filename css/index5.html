<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style7.css" />
  </head>
  <body>
    <h1>Flex-Box Rotation</h1>
    <div id="container">
      <div
        style="
          color: black;
          background-color: orange;
          box-shadow: 2px 2px 15px orange;
          border: 3px solid black;
        "
      >
        orange
      </div>
      <div
        style="
          color: black;
          background-color: white;
          box-shadow: 2px 2px 15px white;
          border: 3px solid black;
        "
      >
        white
      </div>
      <div
        style="
          color: black;
          background-color: green;
          box-shadow: 2px 2px 15px green;
          border: 3px solid black;
        "
      >
        green
      </div>
    </div>
    <br />

    <div id="CONTAINER">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
      <div class="box">E</div>
      <div class="box">F</div>
      <div class="box">G</div>
      <div class="box">H</div>
      <div class="box">I</div>
    </div>
    <br />

    <nav>
      <div id="navbar">
        <div class="option">Logo</div>
        <div class="option">Home</div>
        <div class="option">About</div>
        <div class="option">Contact</div>
      </div>
    </nav>
  </body>
</html>
